<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบจำแนกเลขไทย ๗๑–๗๕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=Noto+Serif+Thai:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1209;
    --paper: #fdf6e3;
    --paper-dark: #f5ead0;
    --gold: #c8963e;
    --gold-light: #e8b96a;
    --gold-dark: #9a6e28;
    --red: #b5292a;
    --red-soft: #e8c5c5;
    --green: #2e6b3e;
    --green-soft: #c8e6d0;
    --shadow: rgba(26, 18, 9, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Sarabun', sans-serif;
    min-height: 100vh;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(200,150,62,0.08) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, rgba(200,150,62,0.04) 28px);
  }

  header {
    background: var(--ink);
    padding: 0;
    position: relative;
    overflow: hidden;
  }

  .header-band {
    background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-dark));
    height: 4px;
  }

  .header-inner {
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-title {
    font-family: 'Noto Serif Thai', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--gold-light);
    letter-spacing: 0.02em;
  }

  .header-sub {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.5);
    margin-top: 2px;
  }

  .header-nav a {
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    font-size: 0.85rem;
    padding: 6px 14px;
    border: 1px solid rgba(200,150,62,0.3);
    border-radius: 4px;
    transition: all 0.2s;
  }

  .header-nav a:hover {
    background: rgba(200,150,62,0.15);
    color: var(--gold-light);
    border-color: var(--gold);
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 24px;
  }

  .page-title {
    text-align: center;
    margin-bottom: 40px;
  }

  .page-title h1 {
    font-family: 'Noto Serif Thai', serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.2;
    text-shadow: 2px 2px 0 rgba(200,150,62,0.2);
  }

  .page-title p {
    color: #7a6040;
    margin-top: 8px;
    font-size: 1rem;
  }

  .digit-chips {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .digit-chip {
    background: var(--ink);
    color: var(--gold-light);
    font-family: 'Noto Serif Thai', serif;
    font-size: 1.2rem;
    font-weight: 700;
    padding: 6px 18px;
    border-radius: 4px;
    border: 1px solid var(--gold-dark);
    letter-spacing: 0.05em;
  }

  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    align-items: start;
  }

  @media (max-width: 680px) {
    .main-grid { grid-template-columns: 1fr; }
  }

  /* Canvas Card */
  .canvas-card {
    background: white;
    border: 2px solid var(--paper-dark);
    border-radius: 8px;
    box-shadow: 4px 4px 0 var(--paper-dark), 8px 8px 0 rgba(200,150,62,0.1);
    overflow: hidden;
  }

  .card-header {
    background: var(--ink);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-header-title {
    font-family: 'Noto Serif Thai', serif;
    color: var(--gold-light);
    font-size: 0.95rem;
    font-weight: 700;
  }

  .card-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--gold);
  }

  .canvas-wrap {
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  #drawCanvas {
    width: 100%;
    max-width: 340px;
    aspect-ratio: 1;
    border: 2px solid var(--paper-dark);
    border-radius: 6px;
    cursor: crosshair;
    background: #ffffff;
    touch-action: none;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.06);
    display: block;
  }

  .canvas-hint {
    font-size: 0.78rem;
    color: #9a8060;
    text-align: center;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 340px;
  }

  .btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-family: 'Sarabun', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
    letter-spacing: 0.03em;
  }

  .btn-predict {
    background: var(--ink);
    color: var(--gold-light);
    border: 2px solid var(--gold-dark);
    box-shadow: 3px 3px 0 var(--gold-dark);
  }

  .btn-predict:hover {
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 var(--gold-dark);
    background: #2a1f0a;
  }

  .btn-predict:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--gold-dark);
  }

  .btn-predict:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .btn-clear {
    background: white;
    color: var(--ink);
    border: 2px solid var(--paper-dark);
    box-shadow: 3px 3px 0 var(--paper-dark);
  }

  .btn-clear:hover {
    background: var(--paper);
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 var(--paper-dark);
  }

  /* Result Card */
  .result-card {
    background: white;
    border: 2px solid var(--paper-dark);
    border-radius: 8px;
    box-shadow: 4px 4px 0 var(--paper-dark), 8px 8px 0 rgba(200,150,62,0.1);
    overflow: hidden;
    min-height: 420px;
    display: flex;
    flex-direction: column;
  }

  .result-body {
    padding: 24px 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .result-main {
    text-align: center;
    padding: 24px 0;
    border-bottom: 1px dashed var(--paper-dark);
  }

  .result-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #9a8060;
    margin-bottom: 8px;
  }

  .result-digit {
    font-family: 'Noto Serif Thai', serif;
    font-size: 6rem;
    font-weight: 900;
    color: var(--ink);
    line-height: 1;
    transition: all 0.3s;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .result-digit.empty { color: #d0c0a0; }
  .result-digit.loading { animation: pulse 1s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .confidence-section {}

  .confidence-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #9a8060;
    margin-bottom: 10px;
  }

  .confidence-val {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--green);
    margin-bottom: 14px;
  }

  .confidence-val.low { color: var(--red); }
  .confidence-val.mid { color: var(--gold-dark); }

  /* Bar chart */
  .prob-bars { display: flex; flex-direction: column; gap: 6px; }

  .prob-row {
    display: grid;
    grid-template-columns: 36px 1fr 44px;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
  }

  .prob-thai {
    font-family: 'Noto Serif Thai', serif;
    font-weight: 700;
    font-size: 0.95rem;
    text-align: right;
  }

  .prob-bar-wrap {
    background: var(--paper-dark);
    border-radius: 3px;
    height: 10px;
    overflow: hidden;
  }

  .prob-bar-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold));
    transition: width 0.5s cubic-bezier(.22,.61,.36,1);
    width: 0;
  }

  .prob-bar-fill.top { background: linear-gradient(90deg, var(--green), #4caf80); }

  .prob-pct {
    font-weight: 600;
    color: #7a6040;
    font-size: 0.78rem;
  }

  .status-msg {
    text-align: center;
    padding: 8px 12px;
    border-radius: 5px;
    font-size: 0.85rem;
    display: none;
  }

  .status-msg.error {
    background: var(--red-soft);
    color: var(--red);
    display: block;
  }

  .status-msg.success {
    background: var(--green-soft);
    color: var(--green);
    display: block;
  }

  .model-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--paper);
    border: 1px solid var(--paper-dark);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.78rem;
    color: #7a6040;
    margin: 0 auto;
  }

  .model-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #bbb;
  }

  .model-dot.active { background: var(--green); box-shadow: 0 0 0 2px var(--green-soft); }
</style>
</head>
<body>

<header>
  <div class="header-band"></div>
  <div class="header-inner">
    <div>
      <div class="header-title">ระบบจำแนกเลขไทย</div>
      <div class="header-sub">Thai Digit Recognition System — หน้าผู้ใช้งาน</div>
    </div>
    <nav class="header-nav">
      <a href="/admin"> Admin</a>
    </nav>
  </div>
</header>

<div class="container">
  <div class="page-title">
    <h1>เขียนเลขไทยเพื่อทำนาย</h1>
    <p>วาดตัวเลขไทยลงในช่องด้านล่าง แล้วกดปุ่ม Predict</p>
    <div class="digit-chips">
      <span class="digit-chip">๗๑</span>
      <span class="digit-chip">๗๒</span>
      <span class="digit-chip">๗๓</span>
      <span class="digit-chip">๗๔</span>
      <span class="digit-chip">๗๕</span>
    </div>
  </div>

  <div id="statusMsg" class="status-msg"></div>

  <div class="main-grid">
    <!-- Canvas -->
    <div class="canvas-card">
      <div class="card-header">
        <div class="card-dot"></div>
        <div class="card-header-title">พื้นที่เขียนตัวเลข</div>
      </div>
      <div class="canvas-wrap">
        <canvas id="drawCanvas" width="340" height="340"></canvas>
        <p class="canvas-hint">วาดตัวเลขให้เต็มพื้นที่ เพื่อผลลัพธ์ที่ดีที่สุด</p>
        <div class="btn-row">
          <button class="btn btn-predict" id="predictBtn" onclick="predict()"> Predict</button>
          <button class="btn btn-clear" onclick="clearCanvas()"> Clear</button>
        </div>
      </div>
    </div>

    <!-- Result -->
    <div class="result-card">
      <div class="card-header">
        <div class="card-dot"></div>
        <div class="card-header-title">ผลการทำนาย</div>
      </div>
      <div class="result-body">
        <div class="result-main">
          <div class="result-label">Prediction</div>
          <div class="result-digit empty" id="resultDigit">—</div>
        </div>

        <div class="confidence-section">
          <div class="confidence-label">Confidence</div>
          <div class="confidence-val" id="confidenceVal">—</div>

          <div class="prob-bars" id="probBars">
            <!-- filled by JS -->
          </div>
        </div>

        <div style="text-align:center; margin-top: auto;">
          <div class="model-badge">
            <div class="model-dot" id="modelDot"></div>
            <span id="modelName">กำลังตรวจสอบโมเดล...</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ─── Canvas setup ───────────────────────────────────────────────────────────
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
let isDrawing = false;
let lastX = 0, lastY = 0;

ctx.strokeStyle = '#1a1209';
ctx.lineWidth = 18;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  if (e.touches) {
    return {
      x: (e.touches[0].clientX - rect.left) * scaleX,
      y: (e.touches[0].clientY - rect.top) * scaleY
    };
  }
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

canvas.addEventListener('mousedown', e => { isDrawing = true; const p = getPos(e); lastX = p.x; lastY = p.y; });
canvas.addEventListener('touchstart', e => { e.preventDefault(); isDrawing = true; const p = getPos(e); lastX = p.x; lastY = p.y; }, {passive: false});

canvas.addEventListener('mousemove', draw);
canvas.addEventListener('touchmove', e => { e.preventDefault(); draw(e); }, {passive: false});

canvas.addEventListener('mouseup', () => isDrawing = false);
canvas.addEventListener('touchend', () => isDrawing = false);
canvas.addEventListener('mouseleave', () => isDrawing = false);

function draw(e) {
  if (!isDrawing) return;
  const p = getPos(e);
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  lastX = p.x; lastY = p.y;
}

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  document.getElementById('resultDigit').textContent = '—';
  document.getElementById('resultDigit').className = 'result-digit empty';
  document.getElementById('confidenceVal').textContent = '—';
  document.getElementById('confidenceVal').className = 'confidence-val';
  document.getElementById('probBars').innerHTML = '';
  hideStatus();
}

// ─── Predict ────────────────────────────────────────────────────────────────
const THAI = ['๗๑','๗๒','๗๓','๗๔','๗๕'];

async function predict() {
  const imageData = canvas.toDataURL('image/png');
  const btn = document.getElementById('predictBtn');

  // Check blank
  const pixelData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  const hasContent = Array.from(pixelData).some((v, i) => i % 4 === 3 && v > 10);
  if (!hasContent) {
    showStatus('กรุณาวาดตัวเลขก่อนกด Predict', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ กำลังทำนาย...';
  document.getElementById('resultDigit').className = 'result-digit loading';
  document.getElementById('resultDigit').textContent = '...';
  hideStatus();

  try {
    const res = await fetch('/predict', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ image: imageData })
    });
    const data = await res.json();

    if (!res.ok || data.error) {
      showStatus(data.error || 'เกิดข้อผิดพลาด', 'error');
      document.getElementById('resultDigit').textContent = '—';
      document.getElementById('resultDigit').className = 'result-digit empty';
      return;
    }

    // Show result
    const digitEl = document.getElementById('resultDigit');
    digitEl.textContent = data.prediction;
    digitEl.className = 'result-digit';

    // Confidence
    const conf = data.confidence;
    const confEl = document.getElementById('confidenceVal');
    confEl.textContent = conf.toFixed(1) + '%';
    confEl.className = 'confidence-val ' + (conf >= 70 ? 'high' : conf >= 40 ? 'mid' : 'low');

    // Probability bars
    const barsEl = document.getElementById('probBars');
    barsEl.innerHTML = '';
    const probs = data.all_probabilities;
    const maxKey = Object.entries(probs).sort((a,b) => b[1]-a[1])[0][0];

    Object.entries(probs).sort((a,b) => b[1]-a[1]).forEach(([label, pct]) => {
      const isTop = label === maxKey;
      const row = document.createElement('div');
      row.className = 'prob-row';
      row.innerHTML = `
        <span class="prob-thai">${label}</span>
        <div class="prob-bar-wrap">
          <div class="prob-bar-fill ${isTop ? 'top' : ''}" style="width:${pct}%"></div>
        </div>
        <span class="prob-pct">${pct.toFixed(1)}%</span>
      `;
      barsEl.appendChild(row);
    });

  } catch(err) {
    showStatus('ไม่สามารถเชื่อมต่อกับ server ได้', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = ' Predict';
  }
}

function showStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + type;
}
function hideStatus() {
  document.getElementById('statusMsg').className = 'status-msg';
}

// ─── Model status ────────────────────────────────────────────────────────────
async function checkModel() {
  try {
    const res = await fetch('/model-status');
    const data = await res.json();
    const dot = document.getElementById('modelDot');
    const name = document.getElementById('modelName');
    if (data.loaded) {
      dot.className = 'model-dot active';
      name.textContent = data.name;
    } else {
      dot.className = 'model-dot';
      name.textContent = 'ยังไม่ได้โหลดโมเดล';
    }
  } catch(e) {}
}
checkModel();
</script>
</body>
</html>
